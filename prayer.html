<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Reader</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Header with Font Size Slider -->
  <header class="header">
    <a href="index.html" class="nav-link" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>

    <div class="header-controls">
      <!-- Font Size Adjustment Slider with - and + Buttons -->
      <div class="font-size-control">
        <button class="font-btn" onclick="adjustFont(-1)" aria-label="Decrease Font Size">A-</button>
        <input type="range" id="fontSlider" class="font-size-slider" min="14" max="26" value="18" oninput="updateFontSize(this.value)">
        <button class="font-btn" onclick="adjustFont(1)" aria-label="Increase Font Size">A+</button>
      </div>

      <!-- Language Selector -->
      <div class="lang-controls">
        <select id="lang1" onchange="renderReader()">
          <option value="en">EN</option>
          <option value="la">LA</option>
        </select>
        <span>|</span>
        <select id="lang2" onchange="renderReader()">
          <option value="none">None</option>
          <option value="la">LA</option>
          <option value="en">EN</option>
        </select>
      </div>

      <!-- Dark Mode Toggle -->
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
    </div>
  </header>

  <main class="app-container">
    <div class="reader-header">
      <a href="index.html" class="pill-btn">← Contents</a>
    </div>

    <h2 id="prayerTitle" class="prayer-title">Loading Prayer...</h2>

    <div id="dualColumns" class="dual-columns">
      <div class="column-pane">
        <div class="pane-label" id="label1">ENGLISH</div>
        <div id="contentPane1"></div>
      </div>
      <div class="column-pane" id="pane2Container" style="display:none;">
        <div class="pane-label" id="label2">LATIN</div>
        <div id="contentPane2"></div>
      </div>
    </div>
  </main>

  <script src="js/prayers-db.js"></script>
  <script>
    function updateFontSize(val) {
      document.documentElement.style.setProperty('--reader-font-size', val + 'px');
      document.getElementById('fontSlider').value = val;
      localStorage.setItem('pref_font_size_px', val);
    }

    function adjustFont(delta) {
      const slider = document.getElementById('fontSlider');
      let currentVal = parseInt(slider.value, 10);
      let newVal = Math.min(Math.max(currentVal + delta, 14), 26);
      updateFontSize(newVal);
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const target = current === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', target);
      localStorage.setItem('pref_theme', target);
    }

    function renderReader() {
      const urlParams = new URLSearchParams(window.location.search);
      const itemKey = urlParams.get('item') || 'morningOffering';

      const l1 = document.getElementById('lang1').value;
      const l2 = document.getElementById('lang2').value;

      localStorage.setItem('pref_pb1', l1);
      localStorage.setItem('pref_pb2', l2);

      const data = prayerDB[itemKey];
      if (!data) return;

      document.getElementById('prayerTitle').innerText = data.title;

      const dualContainer = document.getElementById('dualColumns');
      const pane1 = document.getElementById('contentPane1');
      const pane2Container = document.getElementById('pane2Container');
      const pane2 = document.getElementById('contentPane2');

      document.getElementById('label1').innerText = l1.toUpperCase();
      pane1.innerText = data[l1] || data['en'];

      if (l2 !== 'none' && l1 !== l2) {
        dualContainer.classList.add('split');
        pane2Container.style.display = 'block';
        document.getElementById('label2').innerText = l2.toUpperCase();
        pane2.innerText = data[l2] || data['la'] || data['en'];
      } else {
        dualContainer.classList.remove('split');
        pane2Container.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('lang1').value = localStorage.getItem('pref_pb1') || 'en';
      document.getElementById('lang2').value = localStorage.getItem('pref_pb2') || 'la';
      
      const theme = localStorage.getItem('pref_theme') || 'light';
      document.body.setAttribute('data-theme', theme);

      const savedFontSize = localStorage.getItem('pref_font_size_px') || '18';
      updateFontSize(savedFontSize);
      
      renderReader();
    });
  </script>
</body>
</html>
